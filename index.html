<!DOCTYPE html>
<html lang="en" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignalDesk ISP</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a6dd9">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SignalDesk">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script src="/api/config"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --border:#e2e4e9; --border-strong:#c7cbd4;
  --text:#171a21; --text-2:#5a5f6b; --text-3:#8a8f9b;
  --accent:#2a6dd9; --accent-bg:#e8f0fd; --accent-dark:#184c9e;
  --green:#1a9e63; --green-bg:#e6f7ee;
  --amber:#c98500; --amber-bg:#fdf3e0;
  --red:#d0392f; --red-bg:#fbe9e8;
  --gray:#6b6f78; --gray-bg:#eef0f3;
  --radius:8px; --radius-lg:12px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-size:14px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
.hidden{display:none !important;}

/* ===== LOGIN ===== */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.login-card{width:340px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;text-align:center;}
.login-logo{width:56px;height:56px;border-radius:12px;background:var(--accent-bg);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin:0 auto 14px;}
.login-card h1{font-size:18px;margin:0 0 4px;}
.login-card p{color:var(--text-2);font-size:13px;margin:0 0 20px;}
.field{text-align:left;margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:4px;}
.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--border-strong);border-radius:var(--radius);background:#fff;}
.btn{padding:9px 14px;border-radius:var(--radius);border:1px solid var(--border-strong);background:#fff;font-size:13px;font-weight:600;color:var(--text);}
.btn:hover{background:#f7f8fa;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-block{width:100%;}
.login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px;}
.demo-accounts{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);line-height:1.6;}

/* ===== APP SHELL ===== */
#app{display:none;min-height:100vh;grid-template-columns:220px 1fr;}
#app.show{display:grid;}
#sidebar{background:var(--panel);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;}
.brand-row{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
.brand-logo{width:36px;height:36px;border-radius:8px;background:var(--accent-bg);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0;}
.brand-logo img{width:100%;height:100%;object-fit:cover;}
.brand-name{font-weight:600;font-size:15px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);color:var(--text-2);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;}
.nav-item i{font-size:17px;width:18px;text-align:center;}
.nav-item:hover{background:var(--gray-bg);}
.nav-item.active{background:var(--accent-bg);color:var(--accent-dark);}
.nav-spacer{flex:1;}
.role-box{border-top:1px solid var(--border);padding-top:12px;margin-top:8px;}
.role-user{display:flex;align-items:center;gap:8px;padding:6px 8px;}
.role-avatar{width:28px;height:28px;border-radius:50%;background:var(--gray-bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-2);}
.role-meta{line-height:1.3;}
.role-meta .rn{font-size:12.5px;font-weight:600;}
.role-meta .rr{font-size:11px;color:var(--text-3);text-transform:capitalize;}
.logout-btn{width:100%;margin-top:8px;font-size:12.5px;padding:7px;}

#main{padding:22px 28px;overflow-x:hidden;}
.page{display:none;}
.page.show{display:block;}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.page-title{font-size:20px;font-weight:600;margin:0;}
.page-sub{font-size:13px;color:var(--text-2);margin:2px 0 0;}

.period-toggle{display:flex;border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden;}
.period-toggle button{border:none;background:#fff;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--text-2);border-right:1px solid var(--border-strong);}
.period-toggle button:last-child{border-right:none;}
.period-toggle button.active{background:var(--accent);color:#fff;}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.metric-label{font-size:12px;color:var(--text-2);margin-bottom:6px;}
.metric-val{font-size:22px;font-weight:700;}
.metric-sub{font-size:11.5px;color:var(--text-3);margin-top:4px;}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.tag-green{background:var(--green-bg);color:var(--green);}
.tag-amber{background:var(--amber-bg);color:var(--amber);}
.tag-red{background:var(--red-bg);color:var(--red);}
.tag-gray{background:var(--gray-bg);color:var(--gray);}
.tag-blue{background:var(--accent-bg);color:var(--accent-dark);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.02em;padding:8px 10px;border-bottom:1px solid var(--border);}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border-strong);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);margin-right:4px;}
.icon-btn:hover{background:var(--gray-bg);}
.icon-btn.disabled{opacity:.35;pointer-events:none;}
.ic-wa{color:var(--green);}
.ic-msg{color:var(--accent);}
.ic-sms{color:var(--amber);}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;}
.search-box{flex:1;position:relative;max-width:280px;}
.search-box input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--border-strong);border-radius:var(--radius);}
.search-box i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:15px;}

.modal-bg{position:fixed;inset:0;background:rgba(20,22,28,.45);display:none;align-items:flex-start;justify-content:center;padding-top:60px;z-index:50;}
.modal-bg.show{display:flex;}
.modal{width:420px;max-height:80vh;overflow-y:auto;background:var(--panel);border-radius:var(--radius-lg);padding:20px 22px;}
.modal h3{margin:0 0 14px;font-size:16px;}
.modal .field{margin-bottom:10px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

.empty-note{color:var(--text-3);font-size:13px;padding:20px 0;text-align:center;}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{font-size:11px;color:var(--text-3);text-align:center;padding-bottom:4px;font-weight:600;}
.cal-cell{min-height:64px;border:1px solid var(--border);border-radius:7px;padding:5px;font-size:11px;background:#fff;}
.cal-cell.empty{background:transparent;border:none;}
.cal-date{font-weight:600;color:var(--text-2);margin-bottom:3px;}
.cal-due{font-size:10px;background:var(--amber-bg);color:var(--amber);border-radius:4px;padding:1px 4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.perm-note{background:var(--gray-bg);color:var(--text-2);font-size:12px;border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;}

/* ===== MOBILE TOPBAR (hidden on desktop) ===== */
#mobile-topbar{display:none;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;}
.hamburger-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border-strong);background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--text-2);flex-shrink:0;}
.mobile-brand{font-weight:600;font-size:15px;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(20,22,28,.42);z-index:55;}
#sidebar-overlay.show{display:block;}

/* ===== TABLET / MOBILE RESPONSIVE ===== */
@media (max-width: 900px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
}
@media (max-width: 768px){
  #app{grid-template-columns:1fr;display:flex;flex-direction:column;}
  #app.show{display:flex;}
  #mobile-topbar{display:flex;}
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;width:250px;max-width:80vw;
    transform:translateX(-100%);transition:transform .22s ease;
    z-index:60;box-shadow:3px 0 16px rgba(20,22,28,.18);
    padding-top:14px;
  }
  #sidebar.open{transform:translateX(0);}
  .nav-item{padding:12px 10px;font-size:14.5px;}
  #main{padding:14px 14px 90px;}
  .page-head{flex-direction:column;align-items:flex-start;gap:10px;}
  .page-head > *:last-child{width:100%;}
  .grid-4{grid-template-columns:repeat(2,1fr);gap:10px;}
  .grid-2{grid-template-columns:1fr;gap:12px;}
  .metric-val{font-size:19px;}
  .card{padding:14px;}
  table{font-size:12.5px;}
  th,td{padding:9px 7px;}
  .icon-btn{width:36px;height:36px;}
  .btn{padding:10px 14px;font-size:13.5px;}
  .search-box{max-width:none;width:100%;}
  .toolbar{flex-wrap:wrap;}
  .modal-bg{padding-top:0;align-items:flex-end;}
  .modal{width:100%;max-width:100%;max-height:88vh;border-radius:16px 16px 0 0;padding:18px 16px 22px;}
  .cal-cell{min-height:48px;font-size:10px;padding:4px;}
  .cal-due{font-size:9px;}
  .login-card{width:92vw;max-width:340px;padding:22px 18px;}
  .period-toggle button{padding:8px 12px;}
}
@media (max-width: 420px){
  .grid-4{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo" id="login-logo">SD</div>
    <h1 id="login-title">SignalDesk</h1>
    <p>Sign in to your workspace</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-username" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" id="login-submit-btn" onclick="handleLogin()" disabled>Loading…</button>
    <button class="btn btn-block" id="login-passkey-btn" onclick="handleLoginWithPasskey()" style="margin-top:8px;display:none;"><i class="ti ti-fingerprint" aria-hidden="true"></i> Sign in with passkey</button>
    <div class="login-err" id="login-error"></div>
    <div class="demo-accounts" id="demo-accounts"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="mobile-topbar">
    <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
    <div class="mobile-brand" id="mobile-brand-name"></div>
    <div style="width:38px;"></div>
  </div>
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>
  <div id="sidebar"></div>
  <div id="main"></div>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal-body"></div></div>

<script>
/* ============ SUPABASE CONFIG ============ */
/* Public, environment-specific values come from /api/config (served from the deployment's own env vars SUPABASE_URL and
   SUPABASE_ANON_KEY). No project reference or key is stored in this file. Only the public anon key is ever sent to the browser. */
const SIGNALDESK_CFG = window.SIGNALDESK_CONFIG || {};
const SUPABASE_URL = SIGNALDESK_CFG.SUPABASE_URL || '';
const SUPABASE_ANON_KEY = SIGNALDESK_CFG.SUPABASE_ANON_KEY || '';
let sb = null;
let SUPABASE_READY = false;
try{
  const looksConfigured = SUPABASE_URL && SUPABASE_ANON_KEY
    && SUPABASE_URL.indexOf('YOUR_SUPABASE') === -1
    && /^https?:\/\//.test(SUPABASE_URL);
  if(looksConfigured){
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { experimental: { passkey: true } } // beta feature — requires enabling in Supabase Dashboard too
    });
    SUPABASE_READY = true;
  }
}catch(e){
  console.error('Supabase client failed to initialize. Check SUPABASE_URL / SUPABASE_ANON_KEY.', e);
}
const STATE_ROW_ID = 'main';

/* ============ STORAGE HELPERS ============ */
let DATA = null;

function defaultData(){
  return {
    business: {
      name: 'SignalDesk', logo: '', accentColor: '#2a6dd9',
      // Settings -> Payment Information (GCash). Stored the same way the
      // business logo already is (a plain URL or data-URI string) -- no new
      // storage infrastructure introduced, per HQ instruction.
      paymentInfo: { gcashQrUrl:'', gcashName:'', gcashNumber:'', instructions:'' }
    },
    // Settings -> Reports & Notifications (monthly Investor email report).
    investorReport: { email:'', enabled:false, sendOnDay:1, lastSentAt:null, lastSentPeriod:null },
    plans: [
      { name:'30 Mbps', rate:500 },
      { name:'50 Mbps', rate:700 },
      { name:'100 Mbps', rate:1500 }
    ],
    subscribers: [
      { id:'s1', name:'Marco Reyes', address:'12 Rizal St, Antipolo', email:'marco.reyes@example.com', phone:'+639171234501', whatsapp:'+639171234501', fb:'facebook.com/marco.reyes', messenger:'m.me/marco.reyes', plan:'50 Mbps', rate:700, due:'2026-09-05', status:'paid', archived:false, disconnectedAt:null, ownership:'unassigned', accountUsername:'', napNumber:'', ponNumber:'', connectionDate:null },
      { id:'s2', name:'Liza Cruz', address:'45 Mabini Ave, Antipolo', email:'liza.cruz@example.com', phone:'+639171234502', whatsapp:'+639171234502', fb:'facebook.com/liza.cruz', messenger:'m.me/liza.cruz', plan:'30 Mbps', rate:500, due:'2026-09-10', status:'pending', archived:false, disconnectedAt:null, ownership:'unassigned', accountUsername:'', napNumber:'', ponNumber:'', connectionDate:null },
      { id:'s3', name:'Jun Santos', address:'8 Bonifacio Rd, Antipolo', email:'jun.santos@example.com', phone:'+639171234503', whatsapp:'+639171234503', fb:'facebook.com/jun.santos', messenger:'m.me/jun.santos', plan:'100 Mbps', rate:1500, due:'2026-09-02', status:'paid', archived:false, disconnectedAt:null, ownership:'unassigned', accountUsername:'', napNumber:'', ponNumber:'', connectionDate:null },
      { id:'s4', name:'Ana Villareal', address:'21 Aguinaldo St, Antipolo', email:'ana.villareal@example.com', phone:'+639171234504', whatsapp:'+639171234504', fb:'facebook.com/ana.villareal', messenger:'m.me/ana.villareal', plan:'50 Mbps', rate:700, due:'2026-09-18', status:'pending', archived:false, disconnectedAt:null, ownership:'unassigned', accountUsername:'', napNumber:'', ponNumber:'', connectionDate:null },
      { id:'s5', name:'Pedro Lim', address:'3 Luna St, Antipolo', email:'pedro.lim@example.com', phone:'+639171234505', whatsapp:'+639171234505', fb:'facebook.com/pedro.lim', messenger:'m.me/pedro.lim', plan:'30 Mbps', rate:500, due:'2026-09-22', status:'pending', archived:false, disconnectedAt:null, ownership:'unassigned', accountUsername:'', napNumber:'', ponNumber:'', connectionDate:null },
      { id:'s6', name:'Grace Tan', address:'17 Del Pilar St, Antipolo', email:'grace.tan@example.com', phone:'+639171234506', whatsapp:'+639171234506', fb:'facebook.com/grace.tan', messenger:'m.me/grace.tan', plan:'100 Mbps', rate:1500, due:'2026-09-14', status:'paid', archived:false, disconnectedAt:null, ownership:'unassigned', accountUsername:'', napNumber:'', ponNumber:'', connectionDate:null },
      { id:'s7', name:'Robert Ong', address:'29 Quezon Ave, Antipolo', email:'robert.ong@example.com', phone:'+639171234507', whatsapp:'+639171234507', fb:'facebook.com/robert.ong', messenger:'m.me/robert.ong', plan:'50 Mbps', rate:700, due:'2026-08-01', status:'disconnected', archived:false, disconnectedAt:'2026-08-01', ownership:'unassigned', accountUsername:'', napNumber:'', ponNumber:'', connectionDate:null }
    ],
    payments: [
      { id:'p1', subscriberId:'s1', amount:700, date:'2026-08-05', method:'GCash', archived:false },
      { id:'p2', subscriberId:'s3', amount:1500, date:'2026-08-02', method:'Cash', archived:false },
      { id:'p3', subscriberId:'s6', amount:1500, date:'2026-08-14', method:'GCash', archived:false }
    ],
    expenses: [
      { id:'e1', description:'MikroTik router lease', amount:4500, date:'2026-08-03', category:'Equipment' },
      { id:'e2', description:'Fiber bandwidth (upstream)', amount:6000, date:'2026-08-01', category:'Bandwidth' },
      { id:'e3', description:'Field tech transport', amount:1500, date:'2026-08-10', category:'Operations' }
    ],
    messageTemplate: 'Hi {name}, this is a friendly reminder that your {plan} SignalDesk bill of PHP {rate} is due on {due}. Please settle at your earliest convenience. Thank you!',
    announcementTemplate: 'Hi {name}, this is an announcement from {business}: ',
    auditLog: []
  };
}

/* ============ HANDOFF #002: SAFE, NON-DESTRUCTIVE FIELD BACKFILL ============
   Existing production records (real subscribers/payments/expenses saved
   before this update) will be missing the new fields below. Per HQ's
   "no destructive migration / no silent historical reinterpretation" rule,
   this only ever ADDS defaults in memory on load -- it never rewrites or
   deletes anything, and it is safe to run every time the app starts.

   DUE-DATE INVESTIGATION FINDING (Handoff #002 Section 10): the existing
   `due` field has always stored the subscriber's CURRENT/NEXT due date,
   not a fixed original connection date -- confirmed by confirmPayment()
   advancing it by one month on every payment. Its day-of-month is already,
   in effect, the recurring billing day. So "billingDay" is DERIVED from
   `due` on the fly (billingDayOf()) rather than stored separately, which
   avoids creating a second source of truth that could drift out of sync.
   `connectionDate` is a genuinely new, separate, optional field -- left
   blank for existing subscribers rather than guessed, exactly as required. */
/* BILLING-BEGIN (single source of truth for billing math; copied verbatim into index.html, api/daily-status-check.js, api/sync-sheets.js; tests assert identical copies) */
var BILL = (function(){
  var OVERDUE_AFTER_DAYS = 5, STALE_DAYS = 45, MAX_BACKLOG_DAYS = 1100;
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function parse(d){ return { y:+d.slice(0,4), m:+d.slice(5,7), d:+d.slice(8,10) }; }
  function fmt(y,m,d){ return y+'-'+pad(m)+'-'+pad(d); }
  function dim(y,m){ return new Date(Date.UTC(y,m,0)).getUTCDate(); }
  function dueFor(bd,y,m){ return fmt(y,m,Math.min(bd,dim(y,m))); }
  function addMonths(y,m,n){ var t=y*12+(m-1)+n; return { y:Math.floor(t/12), m:(t%12)+1 }; }
  function dayNum(d){ var p=parse(d); return Math.round(Date.UTC(p.y,p.m-1,p.d)/86400000); }
  function daysBetween(a,b){ return dayNum(b)-dayNum(a); }
  function addDays(d,n){ var t=new Date((dayNum(d)+n)*86400000); return fmt(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()); }
  function dueAfter(bd,d){ var p=parse(d), n=addMonths(p.y,p.m,1); return dueFor(bd,n.y,n.m); }
  function nextDueOnOrAfter(bd,today){ var p=parse(today), c=dueFor(bd,p.y,p.m); if(c>=today) return c; var n=addMonths(p.y,p.m,1); return dueFor(bd,n.y,n.m); }
  function dayOf(d){ return d ? parse(d).d : null; }
  function toC(n){ var v=Math.round(Number(n)*100); return isFinite(v) ? v : 0; }
  function fromC(c){ return (c||0)/100; }
  function splitThree(totalC){ var b=Math.floor(totalC/3); return [b,b,totalC-2*b]; }  // remainder -> last installment
  function paidC(it){ var s=0; (it.applied||[]).forEach(function(a){ s+=a.c; }); return s; }
  function remC(it){ return it.amountC - paidC(it); }
  function find(b,id){ for(var i=0;i<b.obligations.length;i++) if(b.obligations[i].id===id) return b.obligations[i]; return null; }
  function frozen(s){ return s.status==='disconnected' || s.archived || s.permanentlyDeleted; }
  function limitOf(b,today){ return b.billingDay ? nextDueOnOrAfter(b.billingDay,today) : today; }
  function billed(b,it,today){ return it.kind==='opening' || it.dueDate <= limitOf(b,today); }

/* ============ CONCURRENCY SAFETY (HANDOFF #003, Correction #003) ============
   The whole business state is one JSON row, and BOTH this page and the daily
   Cron job write it. Previously every save blindly overwrote the row from
   whatever copy this page loaded at login, so a Cron status change (or a save
   from another device) could be silently erased, and vice-versa.
   Fix, with NO schema change: compare-and-swap on the existing `updated_at`
   column. A save only succeeds if the row's updated_at is still the value we
   last saw. If someone else wrote in between, we re-read their version and
   three-way-merge (base = last version we saw, ours = our edits, theirs =
   current server). Non-overlapping changes merge automatically. A true
   same-field conflict is NEVER reported as success: the latest server data is
   reloaded and the user is told to redo the change. */
let BASE_DATA = null, BASE_VERSION = null;
function cloneData(o){ return JSON.parse(JSON.stringify(o)); }
function setBase(data, version){ BASE_DATA = cloneData(data); BASE_VERSION = version || null; }
/* HANDOFF #008: the database rejects any staff write that adds/changes/removes Admin-only settings. Staff therefore send those
   keys exactly as the server last returned them (even when the app filled in-memory defaults). Admins send everything. */
const ADMIN_ONLY_KEYS = ['business','investorReport','plans','messageTemplate','announcementTemplate'];
/* The only in-memory additions staff may carry (defaults filled by normalizeAllData). Anything else changed in an Admin-only
   setting is a real edit that the server would refuse: report it instead of silently dropping it (no hidden failure). */
const STAFF_DEFAULT_FILLS = { business:['installationFeeDefault','paymentInfo'], investorReport:null };
function staffAdminOnlyEdit(d){
  const base = BASE_DATA || {};
  for(const k of ADMIN_ONLY_KEYS){
    const b = base[k], c = d[k];
    if(b === undefined){ // server has no value yet: only the known defaults may appear in memory
      if(c !== undefined && !(k in STAFF_DEFAULT_FILLS) ) return k;
      continue;
    }
    const allowedExtra = STAFF_DEFAULT_FILLS[k] || [];
    if(c === undefined || typeof b !== 'object' || b === null || Array.isArray(b)){ if(!jeq(b,c)) return k; continue; }
    const cc = cloneData(c); allowedExtra.forEach(x=>{ if(!(x in b)) delete cc[x]; });
    if(!jeq(b,cc)) return k;
  }
  return null;
}
function payloadFor(d){
  if(!SESSION || SESSION.role === 'admin') return d;
  const out = cloneData(d), base = BASE_DATA || {};
  ADMIN_ONLY_KEYS.forEach(k=>{ if(base[k] === undefined) delete out[k]; else out[k] = cloneData(base[k]); });
  return out;
}
function jeq(a,b){ return JSON.stringify(a) === JSON.stringify(b); }
function allHaveId(arrs){ return arrs.every(a => a.every(x => x && typeof x==='object' && typeof x.id==='string')); }
function merge3(base, ours, theirs, path){
  if(jeq(ours,theirs)) return { ok:true, value:ours };
  if(jeq(ours,base)) return { ok:true, value:theirs };
  if(jeq(theirs,base)) return { ok:true, value:ours };
  const isObj = v => v && typeof v==='object' && !Array.isArray(v);
  if(isObj(ours) && isObj(theirs)){
    const b = isObj(base) ? base : {};
    const out = {};
    const keys = new Set([...Object.keys(b), ...Object.keys(ours), ...Object.keys(theirs)]);
    for(const k of keys){
      const r = merge3(b[k], ours[k], theirs[k], path+'.'+k);
      if(!r.ok) return r;
      if(r.value !== undefined) out[k] = r.value;
    }
    return { ok:true, value:out };
  }
  if(Array.isArray(ours) && Array.isArray(theirs)){
    const b = Array.isArray(base) ? base : [];
    if(allHaveId([b,ours,theirs])){
      const by = arr => { const m = new Map(); arr.forEach(x=>m.set(x.id,x)); return m; };
      const bm=by(b), om=by(ours), tm=by(theirs);
      const order = [...theirs.map(x=>x.id), ...ours.map(x=>x.id).filter(id=>!tm.has(id))];
      const out = [];
      for(const id of order){
        const bo=bm.get(id), oo=om.get(id), to=tm.get(id);
        if(oo===undefined && bo!==undefined){ if(jeq(to,bo)) continue; return { ok:false, path:path+'['+id+'] (deleted here, changed elsewhere)' }; }
        if(to===undefined && bo!==undefined){ if(jeq(oo,bo)) continue; return { ok:false, path:path+'['+id+'] (deleted elsewhere, changed here)' }; }
        if(bo===undefined){ if(oo!==undefined && to!==undefined && !jeq(oo,to)) return { ok:false, path:path+'['+id+'] (same id added twice)' }; out.push(oo!==undefined?oo:to); continue; }
        const r = merge3(bo,oo,to,path+'['+id+']');
        if(!r.ok) return r;
        out.push(r.value);
      }
      return { ok:true, value:out };
    }
    // id-less lists (audit log, plans, history entries): treat as sets
    const bk = new Set(b.map(x=>JSON.stringify(x)));
    const tk = new Set(theirs.map(x=>JSON.stringify(x)));
    const ok_ = new Set(ours.map(x=>JSON.stringify(x)));
    const added = ours.filter(x => !bk.has(JSON.stringify(x)) && !tk.has(JSON.stringify(x)));
    const keptTheirs = theirs.filter(x => !(bk.has(JSON.stringify(x)) && !ok_.has(JSON.stringify(x))));
    return { ok:true, value:[...added, ...keptTheirs] };
  }
  return { ok:false, path };
}
async function discardUnsavedChanges(){
  // So the UI never keeps showing a change (e.g. "Paid") that was not actually persisted.
  try{
    const { data: row } = await sb.from('app_state').select('data, updated_at').eq('id', STATE_ROW_ID).single();
    if(row && row.data){ reloadFromRemote(row); if(SESSION) navigate(CURRENT_PAGE); }
  }catch(e){ console.warn('Could not refresh after failed save', e); }
}
function reloadFromRemote(row){
  DATA = cloneData(row.data); setBase(row.data, row.updated_at); normalizeAllData(); // base = exactly what the server holds (before in-memory defaults)
}
async function saveData(){
  if(!SUPABASE_READY){
    console.warn('Supabase is not configured — changes will not be saved permanently.');
    return false;
  }
  try{
    for(let attempt=0; attempt<4; attempt++){
      const newVersion = new Date().toISOString();
      if(SESSION && SESSION.role !== 'admin'){
        const bad = staffAdminOnlyEdit(DATA);
        if(bad){
          alert('Your change was NOT saved: "' + bad + '" is an Admin-only setting. The screen has been refreshed to the last saved data.');
          await discardUnsavedChanges();
          return false;
        }
      }
      const PAYLOAD = payloadFor(DATA);
      let res;
      if(BASE_VERSION){
        res = await sb.from('app_state').update({ data: PAYLOAD, updated_at: newVersion }).eq('id', STATE_ROW_ID).eq('updated_at', BASE_VERSION).select('updated_at');
      } else {
        res = await sb.from('app_state').upsert({ id: STATE_ROW_ID, data: PAYLOAD, updated_at: newVersion }).select('updated_at');
      }
      if(res.error){
        console.error('Supabase save failed', res.error);
        alert('Your change could NOT be saved (' + (res.error.message || 'unknown error') + '). The screen has been refreshed to the last saved data — please try again.');
        await discardUnsavedChanges();
        return false;
      }
      if(res.data && res.data.length){
        setBase(PAYLOAD, res.data[0].updated_at);
        syncToGoogleSheets();
        return true;
      }
      // Zero rows updated: someone else saved since we last looked.
      const { data: row, error: rerr } = await sb.from('app_state').select('data, updated_at').eq('id', STATE_ROW_ID).single();
      if(rerr || !row || !row.data){
        alert('Your change could NOT be saved: the latest data could not be loaded. Please reload the page.');
        return false;
      }
      const m = merge3(BASE_DATA || {}, DATA, cloneData(row.data), 'data'); // clone: normalizeAllData must never mutate the server copy used as the next base
      if(!m.ok){
        reloadFromRemote(row);
        alert('Your change was NOT saved: the same record was changed at the same time by someone or something else (' + m.path + '). The latest data has been reloaded — please redo your change.');
        if(SESSION) navigate(CURRENT_PAGE);
        return false;
      }
      DATA = m.value; normalizeAllData();
      BASE_DATA = cloneData(row.data); BASE_VERSION = row.updated_at; // retry the swap against the newer version
    }
    alert('Your change could NOT be saved after several attempts because the data keeps changing. Please reload and try again.');
    return false;
  }catch(e){
    console.error('Supabase save failed', e);
    alert('Your change could NOT be saved (network or server error). The screen has been refreshed to the last saved data — please try again.');
    await discardUnsavedChanges();
    return false;
  }
}

let SESSION = null; // { username, role, name, userId, accessToken, sessionId }
let idleTimer = null;
let sessionCheckInterval = null;
const IDLE_TIMEOUT_MS = 20 * 60 * 1000; // 20 minutes
const SESSION_CHECK_MS = 30 * 1000; // 30 seconds

function can(action){
  // action: 'edit_business','edit_subscriber','add_subscriber','edit_expense','manage_accounts','edit_settings'
  if(!SESSION) return false;
  if(SESSION.role === 'admin') return true;
  if(SESSION.role === 'user'){
    return ['add_subscriber','edit_subscriber','edit_expense','record_payment'].includes(action);
  }
  return false; // guest: view only
}

function logAudit(text){
  if(!DATA.auditLog) DATA.auditLog = [];

  if(DATA.auditLog.length > 200) DATA.auditLog.length = 200;
}

function resetIdleTimer(){
  if(idleTimer) clearTimeout(idleTimer);

    handleLogout('You were signed out after 20 minutes of inactivity.');
  }, IDLE_TIMEOUT_MS);
}

async function startSingleSessionEnforcement(){
  if(SESSION.role !== 'admin' || !SUPABASE_READY) return;
  const newSessionId = crypto.randomUUID();
  SESSION.sessionId = newSessionId;
  await sb.from('active_sessions').upsert({ user_id: SESSION.userId, session_id: newSessionId, updated_at: new Date().toISOString() });
  if(sessionCheckInterval) clearInterval(sessionCheckInterval);
  sessionCheckInterval = setInterval(async ()=>{
    if(!SESSION) return;
    const { data, error } = await sb.from('active_sessions').select('session_id').eq('user_id', SESSION.userId).single();
    if(!error && data && data.session_id !== SESSION.sessionId){
      handleLogout('You were signed out because this admin account was signed in on another device.');
    }
  }, SESSION_CHECK_MS);
}
function stopSingleSessionEnforcement(){
  if(sessionCheckInterval) clearInterval(sessionCheckInterval);
  sessionCheckInterval = null;
}

async function runAutoArchiveChecks(){
  if(!can('add_subscriber') && SESSION.role !== 'admin') return; // only admin/user can write
  const now = Date.now();
  const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
  const NINETY_DAYS = 90 * 24 * 60 * 60 * 1000; // ~3 months
  let changed = false;
  (DATA.subscribers||[]).forEach(s=>{
    if(s.status === 'disconnected' && s.disconnectedAt && !s.archived){
      const age = now - new Date(s.disconnectedAt+'T00:00:00').getTime();
      if(age >= THIRTY_DAYS){ s.archived = true; changed = true; }
    }
  });
  (DATA.payments||[]).forEach(p=>{
    if(p.date && !p.archived){
      const age = now - new Date(p.date+'T00:00:00').getTime();
      if(age >= NINETY_DAYS){ p.archived = true; changed = true; }
    }
  });
  if(changed) await saveData();
}

  const { data: profile, error } = await sb.from('profiles').select('name, role').eq('id', session.user.id).single();
  if(error || !profile){
    errEl.textContent = 'Your account has no profile set up yet. Ask your admin to add one.';
    await sb.auth.signOut();
    return;
  }
  SESSION = {
    username: session.user.email,
    role: profile.role,
    name: profile.name,
    userId: session.user.id,
    accessToken: session.access_token
  };
  // Now that we're actually authenticated, re-check the real data. If the
  // table is still genuinely empty/invalid, seed it for real — this write
  // only succeeds now because we're signed in with an admin/user role.
  const { data: existing } = await sb.from('app_state').select('data, updated_at').eq('id', STATE_ROW_ID).single();
  const remote = existing && existing.data;
  const looksValid = remote && typeof remote === 'object' && remote.business && Array.isArray(remote.subscribers);
  if(looksValid){
    DATA = remote;
    setBase(remote, existing.updated_at);
  } else if(SESSION.role === 'admin'){
    DATA = defaultData();
    BASE_DATA = {}; BASE_VERSION = (existing && existing.updated_at) || null; // existing-but-empty row -> CAS update; no row -> insert
    await saveData();
  }
  normalizeAllData();
  applyAccentColor();
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  document.getElementById('app').style.display = 'grid';
  renderShell();
  navigate('overview');
  resetIdleTimer();
  await startSingleSessionEnforcement();
  await runAutoArchiveChecks();
}

function applyAccentColor(){
  const color = (DATA && DATA.business && DATA.business.accentColor) || '#2a6dd9';
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--accent-dark', shadeColor(color, -18));
  document.documentElement.style.setProperty('--accent-bg', shadeColor(color, 85));
}
function shadeColor(hex, percent){
  hex = hex.replace('#','');
  if(hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex, 16);
  let r = (num >> 16), g = (num >> 8 & 0x00FF), b = (num & 0x0000FF);
  const amt = Math.round(2.55 * percent);
  r = Math.min(255, Math.max(0, r + amt));
  g = Math.min(255, Math.max(0, g + amt));
  b = Math.min(255, Math.max(0, b + amt));
  return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
}

/* ============ OWN / INVESTOR / OVERALL \u2014 AUTHORITATIVE CALCULATION
   (HANDOFF #002 Sections 7/8/9). This is the SINGLE source of truth used
   by the Dashboard, the Google Sheets Investor Report, and the monthly
   Investor email -- all three must reconcile, so all three call this.
   Payments/expenses recorded before ownership/allocation existed have no
   `ownership`/`allocation` field; they're intentionally excluded from the
   Own/Investor split (never retroactively guessed) and counted only in
   Overall, consistent with "no silent historical financial recomputation". */
/* TOTALS-BEGIN (single source of truth; copied verbatim into index.html, api/daily-status-check.js and api/sync-sheets.js — tests assert the three copies are identical) */
function computeOwnershipTotals(data, period){
  // period: null = all-time, or { from:'YYYY-MM-DD', to:'YYYY-MM-DD' } inclusive.
  data = data || {};
  var inP = function(d){ if(!period) return true; return !!d && d >= period.from && d <= period.to; };
  var subs = (data.subscribers||[]).filter(function(s){ return !s.permanentlyDeleted; });
  var active = subs.filter(function(s){ return !s.archived; });
  var counts = { own:0, investor:0, unassigned:0, overall:active.length };
  active.forEach(function(s){ counts[(s.ownership==='own'||s.ownership==='investor') ? s.ownership : 'unassigned']++; });
  var revenue = { own:0, investor:0, unassigned:0, overall:0 };
  var expenses = { own:0, investor:0, unclassified:0, overall:0 };
  (data.payments||[]).forEach(function(p){
    if(!inP(p.date)) return;
    var a = Number(p.amount)||0;
    revenue.overall += a;
    if(p.ownership==='own') revenue.own += a;
    else if(p.ownership==='investor') revenue.investor += a;
    else revenue.unassigned += a; // legacy (no snapshot) or explicitly unassigned -- never guessed
  });
  (data.expenses||[]).filter(function(e){ return !e.voided; }).forEach(function(e){
    if(!inP(e.date)) return;
    var a = Number(e.amount)||0;
    expenses.overall += a;
    if(e.allocation){ expenses.own += Number(e.allocation.own)||0; expenses.investor += Number(e.allocation.investor)||0; }
    else expenses.unclassified += a; // legacy expense with no allocation snapshot
  });
  return {
    period: period || null,
    counts: counts, revenue: revenue, expenses: expenses,
    net: { own: revenue.own-expenses.own, investor: revenue.investor-expenses.investor, overall: revenue.overall-expenses.overall }
  };
}
function monthPeriod(key){ // 'YYYY-MM' -> inclusive period
  var y = Number(key.slice(0,4)), m = Number(key.slice(5,7));
  var last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return { key: key, from: key+'-01', to: key+'-'+(last<10 ? '0'+last : ''+last) };
}
function prevMonthPeriod(todayStr){ // todayStr = Manila calendar date 'YYYY-MM-DD' -> previous completed month
  var y = Number(todayStr.slice(0,4)), m = Number(todayStr.slice(5,7));
  var py = (m===1) ? y-1 : y, pm = (m===1) ? 12 : m-1;
  return monthPeriod(py+'-'+(pm<10 ? '0'+pm : ''+pm));
}
function activityMonthKeys(data){
  var seen = {};
  (data.payments||[]).forEach(function(p){ if(p.date) seen[p.date.slice(0,7)] = 1; });
  (data.expenses||[]).filter(function(e){ return !e.voided; }).forEach(function(e){ if(e.date) seen[e.date.slice(0,7)] = 1; });
  return Object.keys(seen).sort();
}
/* TOTALS-END */
function reviewPending(s){ return !!(s && s.billing && s.billing.review && !s.archived && !s.permanentlyDeleted && s.status!=='disconnected'); }
function statusTagFor(s){ if(reviewPending(s)) return '<span class="tag tag-amber" title="Billing baseline not verified yet — no automatic notices are sent">Needs review</span>'; return statusTag(s.status); }
function subDueCell(s){
  if(reviewPending(s)) return `<span style="color:var(--text-3);">${s.due||'-'}</span><div style="font-size:11px;color:var(--amber);">unverified</div>`;
  const m = s.billing ? BILL.summary(s, todayLocal()) : null;
  return `${s.due||'-'}${m && m.outstandingC>0 ? `<div style="font-size:11px;color:var(--text-3);">owes ${peso(BILL.fromC(m.outstandingC))}${m.pastDueC>0?` · ${peso(BILL.fromC(m.pastDueC))} past due`:''}</div>`:''}${m && m.creditC>0 ? `<div style="font-size:11px;color:var(--green);">credit ${peso(BILL.fromC(m.creditC))}</div>`:''}`;
}
function canExtend(s){
  if(!s.billing || s.billing.review || s.archived || s.status==='disconnected') return false;
  const st = BILL.accountStatus(s, todayLocal()); return st==='pending'||st==='overdue'||st==='due';
}
function statusTag(status){
  const map = { paid:['tag-green','Paid'], pending:['tag-amber','Pending'], overdue:['tag-red','Overdue'], disconnected:['tag-gray','Disconnected'], extended:['tag-blue','Extended'] };
  const [cls,label] = map[status] || ['tag-gray', status];
  return `<span class="tag ${cls}">${label}</span>`;
}

async function archiveSubscriber(id){

async function restoreSubscriber(id){

/* ============ ARCHIVED SUBSCRIBER DELETE (HANDOFF #002, Section 5) ============
   Dependency inspection finding: Payments store subscriberId, and the
   Payments/Transactions tables and the Google Sheets export resolve that ID
   back to a name via `(subscribers.find(...)||{}).name || 'Unknown'`. A true
   hard delete wouldn't crash that lookup, but it WOULD silently turn every
   past payment's subscriber name into "Unknown" across Payments,
   Transactions and Sheets -- a real loss of financial-history readability.
   Per HQ's explicit instruction ("financial/history integrity takes
   priority over hard deletion... recommend a safe alternative such as
   anonymization"), this implements anonymization instead of a hard
   DELETE: the record (and its id, so payment history keeps resolving)
   stays, but every identifying field is cleared and it's hidden from
   every list via permanentlyDeleted. */
function openDeleteSubscriberModal(id){
  if(!can('edit_subscriber')) return;
  const s = DATA.subscribers.find(x=>x.id===id);
  if(!s || s.permanentlyDeleted || !s.archived) return;
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <h3 style="color:var(--red);">Delete archived subscriber</h3>
    <p style="font-size:13px;color:var(--text-2);">You are about to permanently delete:</p>
    <div class="card" style="background:var(--gray-bg);margin-bottom:12px;">
      <div style="font-weight:600;">${escapeHtml(s.name)}</div>
      <div style="font-size:12px;color:var(--text-2);">${escapeHtml(s.address)}</div>
    </div>
    <p style="font-size:12.5px;color:var(--red);line-height:1.5;">This cannot be undone. To protect financial history, SignalDesk does not erase payment records tied to this subscriber -- their past payments remain in Payments/Transactions/Sheets, but this subscriber's name, address, contact and network details will be <strong>irreversibly removed</strong> and replaced with "Deleted Subscriber". Older Activity Log lines that mention this person's name will have the name replaced with the record ID; the entries, dates and amounts are kept.</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn" style="background:var(--red);border-color:var(--red);color:#fff;" onclick="permanentlyDeleteSubscriber('${s.id}')">Delete permanently</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('show');
}
async function permanentlyDeleteSubscriber(id){
  if(!can('edit_subscriber')) return;
  const s = DATA.subscribers.find(x=>x.id===id);
  if(!s || s.permanentlyDeleted || !s.archived) return; // blocks duplicate deletion and deleting non-archived records
  const originalName = s.name;
  s.name = 'Deleted Subscriber';
  s.address = ''; s.email=''; s.phone=''; s.whatsapp=''; s.fb=''; s.messenger='';
  s.accountUsername=''; s.napNumber=''; s.ponNumber=''; s.connectionDate=null;
  s.permanentlyDeleted = true;
  s.deletedAt = todayLocal();
  // HANDOFF #004 D7: redact the person's name from free-text activity-log lines (entries themselves, timestamps,
  // actors and amounts are kept, so the audit sequence stays intact).
  if(originalName && originalName.trim().length>=2){
    const re = new RegExp(originalName.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    (DATA.auditLog||[]).forEach(a=>{ if(a && typeof a.text==='string') a.text = a.text.replace(re,'[record '+id+']'); });
  }
  logAudit(`Permanently deleted archived subscriber record ${id} (payment history preserved under "Deleted Subscriber")`);
  await saveData();
  closeModal();
  navigate('subscribers');
}
async function sendExtensionGrantedEmail(s, outstanding, originalDue){
  if(!s.email) return;
  try{
    await fetch('/api/send-receipt', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
      type:'extension-granted', to:s.email, subscriberName:s.name, accountUsername:s.accountUsername||'',
      plan:s.plan, amount:outstanding, originalDue:originalDue||'', extensionUntil:s.extensionUntil, businessName:DATA.business.name, logoUrl:DATA.business.logo||''
    })});
  }catch(e){ console.warn('Extension email failed (extension is still saved):', e); }
}

/* ============ PAY NOW / DISCONNECT / RECONNECT / EXTEND (V1.8) ============ */
async function disconnectSubscriber(id){
  if(!can('edit_subscriber')) return;
  const s = DATA.subscribers.find(x=>x.id===id);
  if(!s) return;
  if(!confirm(`Disconnect ${s.name}? They'll stop receiving reminders and no new monthly charges are created while disconnected. Any unpaid balance already billed is kept. This can be reversed with Reconnect.`)) return;
  const today = todayLocal();
  // Payment history is never deleted (HANDOFF #004). Any active extension is closed with its history kept.
  if(s.billing){ s.billing.obligations.forEach(it=>{ if(it.ext && !it.ext.resolution){ it.ext.resolution='disconnected'; it.ext.resolvedAt=today; s.billing.extensionLog.push(Object.assign({itemId:it.id},it.ext)); } }); }
  s.extensionGrantedAt = null; s.extensionUntil = null; s.extensionReason=''; s.extensionGrantedBy=null;
  s.status = 'disconnected';
  s.statusSince = today;
  s.disconnectedAt = today;
  logAudit(`Disconnected subscriber ${s.name}`);
  await saveData();
  navigate('subscribers');
}
async function reconnectSubscriber(id){
  if(!can('edit_subscriber')) return;
  const s = DATA.subscribers.find(x=>x.id===id);
  if(!s) return;
  if(!confirm(`Reconnect ${s.name}? Billing resumes from their next billing date. No charges are created for the time they were disconnected; any unpaid balance from before is kept.`)) return;
  const today = todayLocal();
  s.disconnectedAt = null; s.status = 'paid'; s.statusSince = today;
  if(!s.billing) BILL.migrateLegacy(s,today);
  const r = BILL.reconnect(s,today);
  if(r && r.ok && !r.needsReview){ BILL.daily(s,today); BILL.syncLegacyFields(s,today); }
  logAudit(`Reconnected subscriber ${s.name}${r&&r.needsReview?' (billing baseline needs review)':''}`);
  await saveData();
  navigate('subscribers');
}
/* ============ GRANT EXTENSION — MANUAL WORKFLOW (HANDOFF #002 Sections
   17-23). Replaces the old automatic "~1 month + pay double next cycle"
   behavior with an operator-chosen deadline and no forced duration or
   billing assumption. The subscriber's normal recurring billing day is
   never touched by an extension — only the current cycle's actionable
   deadline changes. ============ */
function extendSubscriber(id){
  if(!can('edit_subscriber')) return;
  const s = DATA.subscribers.find(x=>x.id===id);
  if(!s) return;
  const today = todayLocal();
  const c = s.billing && !s.billing.review ? BILL.controlling(s,today) : null;
  if(!c){ alert('This subscriber has no verified unpaid subscription charge to extend.'); return; }
  const rows = BILL.breakdownFor(s,c,today);
  const totalC = rows.reduce((a,r)=>a+r.remainingC,0);
  const minDate = BILL.addDays(c.dueDate>today?c.dueDate:today, c.dueDate>today?1:0);
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <h3>Grant payment extension</h3>
    <p style="font-size:13px;color:var(--text-2);margin:0 0 4px;">Subscriber: <strong>${escapeHtml(s.name)}</strong></p>
    <p style="font-size:12.5px;color:var(--text-2);margin:0 0 10px;">Outstanding obligation: <strong>${peso(BILL.fromC(totalC))}</strong> &middot; Original due date: <strong>${c.dueDate}</strong></p>
    ${rows.length>1?`<div style="font-size:12px;color:var(--text-3);margin-bottom:10px;">${rows.map(r=>`${r.kind==='subscription'?'Subscription':'Installation'}: ${peso(BILL.fromC(r.remainingC))}`).join(' &middot; ')}</div>`:''}
    <div class="field"><label>Extension deadline</label><input id="ext-deadline" type="date" min="${minDate}" value="${minDate}"></div>
    <div class="field"><label>Reason / note <span style="color:var(--text-3);">(optional)</span></label><textarea id="ext-reason" rows="2" style="width:100%;padding:9px 10px;border:1px solid var(--border-strong);border-radius:var(--radius);"></textarea></div>
    <div style="font-size:11.5px;color:var(--text-3);margin-bottom:4px;">This does not forgive the balance, change ${escapeHtml(s.name)}'s billing day, or double next month's bill. If it is still unpaid after the deadline, the account becomes Overdue immediately.</div>
    <div id="ext-err" style="color:var(--red);font-size:12px;"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="grantExtension('${s.id}')">Grant extension</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('show');
}
async function grantExtension(id){
  const s = DATA.subscribers.find(x=>x.id===id);
  if(!s) return;
  const deadline = document.getElementById('ext-deadline').value;
  const errEl = document.getElementById('ext-err');
  if(!deadline){ errEl.textContent = 'Choose an extension deadline'; return; }
  const today = todayLocal();
  const c = s.billing && !s.billing.review ? BILL.controlling(s,today) : null;
  if(!c){ errEl.textContent = 'No verified unpaid subscription charge to extend'; return; }
  const reason = document.getElementById('ext-reason').value.trim();
  const r = BILL.grantExtension(s, c.id, deadline, today, reason, SESSION ? SESSION.name : 'System');
  if(!r.ok){ errEl.textContent = r.error; return; }
  BILL.syncLegacyFields(s,today);
  s.statusSince = today;
  const totalC = BILL.breakdownFor(s,c,today).reduce((a,x)=>a+x.remainingC,0);
  logAudit(`Granted ${s.name} a payment extension until ${deadline}${reason?(' — '+reason):''}`);
  const saved = await saveData();
  closeModal();
  navigate('subscribers');
  if(saved) sendExtensionGrantedEmail(s, BILL.fromC(totalC), c.dueDate);
}

/* ============ RATE REVIEW (HANDOFF #005 T2) ============ */

async function applyRateReview(){
  const today=todayLocal(), errs=[]; let done=0;
  document.querySelectorAll('[data-rr]').forEach(r=>{ const v=r.querySelector('.rr-amt').value; if(v==='') return; const [sid,iid]=r.dataset.rr.split('|'); const s=DATA.subscribers.find(x=>x.id===sid); if(!s) return;
    const res=BILL.resolveRateReview(s,iid,BILL.toC(v),SESSION?SESSION.name:null,today); if(!res.ok){ errs.push(s.name+': '+res.error); return; } BILL.syncLegacyFields(s,today); logAudit(`Confirmed rate for ${s.name} charge ${iid}: ${peso(v)}`); done++; });

/* ============ BILLING REVIEW (HANDOFF #004 D1) ============ */
function rvRead(row){
  return { id:row.dataset.rv, connectionDate:row.querySelector('.rv-conn').value||null, billingDay:Number(row.querySelector('.rv-day').value)||null,
    firstDue:row.querySelector('.rv-first').value||null, opening:{ state:row.querySelector('.rv-open').value, amountC:BILL.toC(row.querySelector('.rv-amt').value) } };
}
// Dry-run of an approval on a COPY: shows exactly what the operator is about to create. Nothing is saved.
function rvSimulate(orig, v, today, suppress){
  const s = JSON.parse(JSON.stringify(orig));
  const r = BILL.resolveReview(s, { today, billingDay:v.billingDay, firstDue:v.firstDue, connectionDate:v.connectionDate, opening:v.opening, suppressPast:suppress, by:null });
  return { s, r };
}
function rvRefresh(row){
  if(!row) return; const today = todayLocal(); const orig = DATA.subscribers.find(x=>x.id===row.dataset.rv); if(!orig) return;
  const v = rvRead(row), box = row.querySelector('.rv-prev'), suppress = document.getElementById('rv-suppress').checked;
  row.querySelector('.rv-amt').style.display = v.opening.state==='verified-positive' ? '' : 'none';
  const warn = [];
  if(!v.billingDay || v.billingDay<1 || v.billingDay>31) warn.push('Enter a billing day (1–31).');
  if(v.connectionDate && v.connectionDate>today) warn.push('Connection date is in the future.');
  if(v.opening.state==='verified-positive' && !(v.opening.amountC>0)) warn.push('Enter the verified amount owed.');
  if(v.connectionDate && v.billingDay && BILL.dayOf(v.connectionDate)!==v.billingDay) warn.push(`Billing day ${v.billingDay} differs from the connection day (${BILL.dayOf(v.connectionDate)}). That is fine if it was agreed — please confirm.`);
  if(!v.connectionDate) warn.push('No connection date on file (informational only).');
  if(v.opening.state==='unverified') warn.push('Earlier balance is NOT verified: it will not be billed, counted or shown in any customer email.');
  let html = '';
  if(!warn.some(w=>/^Enter /.test(w)) ){
    const { s, r } = rvSimulate(orig, v, today, suppress);
    if(!r.ok){ warn.push(r.error); }
    else {
      const b = s.billing, m = BILL.summary(s,today);
      const unpaid = b.obligations.filter(o=>BILL.remC(o)>0);
      const past = unpaid.filter(o=>o.dueDate && o.dueDate<today);
      const nd = BILL.nextDue(s,today);
      html += `<div style="font-size:12px;line-height:1.5;">
        <div><strong>Next due date:</strong> ${nd||'-'} &nbsp; <strong>Outstanding after approval:</strong> ${peso(BILL.fromC(m.outstandingC))} <span style="color:var(--text-3);">(due now ${peso(BILL.fromC(m.dueNowC))}, not yet due ${peso(BILL.fromC(m.futureC))})</span></div>
        <div style="color:var(--text-2);">${unpaid.length?unpaid.map(o=>`${o.kind==='opening'?'Earlier balance':'Subscription'} ${o.dueDate||'(undated)'} ${peso(BILL.fromC(BILL.remC(o)))}`).join(' · '):'No charges created yet.'}</div>
        <div style="color:var(--text-2);"><strong>Notices:</strong> ${past.length?(suppress?`${past.length} charge(s) already past due — reminders for them are suppressed; `:`${past.length} charge(s) already past due — reminders WILL be sent on the next run; `):''}${nd?`first automatic reminder for the next charge on ${BILL.addDays(nd,1)} (Pending)`:'none scheduled'}${s.email?'':' <span style="color:var(--amber);">— no email on file, notices will be skipped</span>'}.</div>
      </div>`;
      if(past.length && v.firstDue && v.firstDue<today) warn.push(`Charges for ${past.length} period(s) before today will be created from the first billed due date. Only keep this if that debt is real.`);
    }
  }
  box.innerHTML = html + (warn.length?`<div style="font-size:11.5px;color:var(--amber);margin-top:4px;">${warn.map(escapeHtml).join('<br>')}</div>`:'');
  row.dataset.rvblock = warn.some(w=>/^Enter |future|too far|required/i.test(w)) ? '1' : '';
}

async function applyBillingReview(){
  const today = todayLocal(), errEl = document.getElementById('rv-err');
  const suppress = document.getElementById('rv-suppress').checked;
  const rows = Array.from(document.querySelectorAll('[data-rv]')).filter(r=>r.querySelector('.rv-sel').checked);
  if(!rows.length){ errEl.textContent = 'Tick at least one subscriber to approve.'; return; }
  const errs = []; let done = 0;
  rows.forEach(r=>{
    const s = DATA.subscribers.find(x=>x.id===r.dataset.rv); if(!s) return;
    const v = rvRead(r); rvRefresh(r);
    if(r.dataset.rvblock){ errs.push(s.name+': fix the highlighted item first'); return; }
    const res = BILL.resolveReview(s, { today, billingDay:v.billingDay, firstDue:v.firstDue, connectionDate:v.connectionDate, opening:v.opening, suppressPast:suppress, by:SESSION?SESSION.name:null });
    if(!res.ok){ errs.push(s.name+': '+res.error); return; }
    BILL.syncLegacyFields(s,today); s.statusSince = today; done++;
    logAudit(`Verified billing baseline for ${s.name} (billing day ${s.billing.billingDay}, first due ${s.billing.firstDue}, earlier balance: ${s.billing.opening.state})`);
  });
  if(errs.length){ errEl.textContent = errs.join(' | '); }
  if(done){ const ok = await saveData(); if(!ok) return; if(!errs.length){ closeModal(); } navigate('subscribers'); if(errs.length) openBillingReviewModal(); }
}

function isNewConnectionPath(connectionDate, today){
  // A connection whose FIRST postpaid due date (one month after connection) is still in the future is a genuinely new
  // subscriber (billed from that first due date). Anything older is an existing subscriber being registered now:
  // no retroactive charges, next due = next billing date (HANDOFF #004 Sections 6-7).
  if(!connectionDate) return true;
  return BILL.dueAfter(BILL.dayOf(connectionDate), connectionDate) > today;
}

async function saveSubscriber(id){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ document.getElementById('f-err').textContent = 'Enter a name first'; return; }
  const existing = id ? DATA.subscribers.find(x=>x.id===id) : null;
  const today = todayLocal();
  const errEl = document.getElementById('f-err');
  const rate = Number(document.getElementById('f-rate').value)||0;
  if(rate<=0){ errEl.textContent = 'Enter a monthly rate greater than zero'; return; }
  const connectionDate = document.getElementById('f-connection-date').value || null;
  if(!existing && !connectionDate){ errEl.textContent = 'Enter the connection date'; return; }
  if(!existing && connectionDate > today){ errEl.textContent = 'Connection date cannot be in the future'; return; }
  const common = {
    name,
    address: document.getElementById('f-address').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    whatsapp: document.getElementById('f-whatsapp').value.trim(),
    fb: document.getElementById('f-fb').value.trim(),
    messenger: document.getElementById('f-messenger').value.trim(),
    plan: document.getElementById('f-plan').value,
    rate,
    ownership: document.getElementById('f-ownership').value,
    connectionDate,
    accountUsername: document.getElementById('f-account-username').value.trim(),
    napNumber: document.getElementById('f-nap').value.trim(),
    ponNumber: document.getElementById('f-pon').value.trim()
  };
  if(existing){
    // Edits never touch billing structure; the rate only affects future/not-yet-due charges (BILL.repriceUpcoming).
    const newRate = common.rate; delete common.rate;
    Object.assign(existing, common);
    existing.connectionDate = connectionDate || existing.connectionDate || null;
    if(Number(newRate)!==Number(existing.rate)){
      if(existing.billing && !existing.billing.review){
        const eff = (document.getElementById('f-rate-eff')||{}).value || today;
        const rr = BILL.setRate(existing, newRate, eff, today, SESSION?SESSION.name:null);
        if(!rr.ok){ errEl.textContent = rr.error; return; }
        logAudit(`Rate change for ${existing.name}: ${peso(newRate)}/mo effective ${eff}`);
      } else existing.rate = newRate;
    }
    BILL.daily(existing, today); BILL.syncLegacyFields(existing, today);
    logAudit(`Edited subscriber ${existing.name}`);
  } else {
    const rec = Object.assign({
      id: 's'+Date.now()+Math.random().toString(36).slice(2,5),
      due:'', status:'paid', statusSince: today, archived:false, disconnectedAt:null, permanentlyDeleted:false,
      extensionGrantedAt:null, extensionUntil:null, extensionReason:'', extensionGrantedBy:null, extensionHistory:[],
      lastWarningSentFor:null, extensionReminderSentFor:null, lastPendingReminderSentFor:null, currentPaymentId:null, billing:null
    }, common);
    if(isNewConnectionPath(connectionDate, today)){
      const arr = document.getElementById('f-inst-arr').value;
      const totalC = BILL.toC(document.getElementById('f-inst-amount').value);
      if(arr!=='none' && !(totalC>0)){ errEl.textContent = 'Enter the installation fee amount (or choose No installation fee)'; return; }
      BILL.onboardNew(rec, { connectionDate, today, installation: arr==='none' ? null : { totalC, arrangement: arr } });
    } else {
      const st = document.getElementById('f-open-state').value;
      const amtC = BILL.toC(document.getElementById('f-open-amount').value);
      if(st==='verified-positive' && !(amtC>0)){ errEl.textContent = 'Enter the verified amount owed'; return; }
      BILL.onboardExisting(rec, { connectionDate, today, opening: { state: st, amountC: amtC } });
    }
    BILL.syncLegacyFields(rec, today);
    DATA.subscribers.push(rec);
    logAudit(`Added subscriber ${rec.name}`);
  }
  await saveData();
  closeModal();
  navigate('subscribers');
}

/* DISCOVERED DURING TESTING OF THIS CORRECTION (flagged in Report #002,
   item 30 "known limitations"): building a date with `new Date(y,m,d)`
   (local time) and then reading it back via `.toISOString()` silently
   shifts the calendar date backward by one day for any browser whose local
   clock is ahead of UTC -- which includes every Philippines-based user
   (UTC+8). `new Date(2026,0,31).toISOString()` is "2026-01-30T16:00:00Z",
   so `.slice(0,10)` wrongly returns "2026-01-30". This bug already existed
   in the original addOneMonth(). Fixed here by formatting the LOCAL
   calendar date directly (getFullYear/getMonth/getDate) instead of ever
   converting through toISOString. */
function fmtLocalDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayLocal(){ return fmtLocalDate(new Date()); }

/* HANDOFF #002 Section 13 (month-end edge cases): a recurring billing day of
   29/30/31 doesn't exist in every month (e.g. Feb). Deterministic rule used
   here: clamp to the LAST valid day of the target month rather than letting
   JS's Date silently roll over into the following month (the previous
   `d.setMonth()+1` approach had exactly that bug: Jan 31 -> Mar 3, not Feb
   28/29). This is the "minimum-safe behavior" being reported to HQ. */
function addOneMonth(dateStr){
  if(!dateStr) return todayLocal();
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDate();
  const targetMonthIndex = d.getMonth()+1; // 0-11, may be >11
  const targetYear = d.getFullYear() + Math.floor(targetMonthIndex/12);
  const mm = ((targetMonthIndex%12)+12)%12;
  const lastDayOfTargetMonth = new Date(targetYear, mm+1, 0).getDate();
  const useDay = Math.min(day, lastDayOfTargetMonth);
  return fmtLocalDate(new Date(targetYear, mm, useDay));
}
// Clamp an arbitrary recurring billing day into a specific (year, monthIndex)
// the same deterministic way -- used by the Calendar to generate this
// month's obligation date from a subscriber's recurring billing day, per
// HANDOFF #002 Section 11/13.
function clampDayToMonth(day, year, monthIndex){
  const lastDay = new Date(year, monthIndex+1, 0).getDate();
  const useDay = Math.min(day, lastDay);
  return fmtLocalDate(new Date(year, monthIndex, useDay));
}
let paymentInFlight = false;
async function confirmPayment(subscriberId){
  if(paymentInFlight) return; // blocks double-clicks creating duplicate payments/confirmations
  paymentInFlight = true;
  try{ await confirmPaymentInner(subscriberId); } finally { paymentInFlight = false; }
}
async function confirmPaymentInner(subscriberId){
  const amount = Math.round((Number(document.getElementById('pm-amount').value)||0)*100)/100;
  const errEl = document.getElementById('pm-err');
  if(amount<=0){ errEl.textContent = 'Enter a valid amount'; return; }
  const method = document.getElementById('pm-method').value;
  const date = document.getElementById('pm-date').value || todayLocal();
  const sub = DATA.subscribers.find(x=>x.id===subscriberId);
  if(!sub) return;
  if(!sub.billing || sub.billing.review){ errEl.textContent = 'Verify this subscriber\'s billing first (Subscribers → Review billing).'; return; }
  const today = todayLocal();
  const paymentId = 'p'+Date.now()+Math.random().toString(36).slice(2,6);
  // Applies the cash to the oldest charges first (opening balance, then by due date, subscription before installation),
  // keeps the component breakdown, and stores any excess as credit. The ledger is the single source of truth.
  const r = BILL.recordPayment(sub, BILL.toC(amount), paymentId, today);
  if(!r.ok){ errEl.textContent = r.error; return; }
  BILL.syncLegacyFields(sub, today);
  sub.statusSince = today;
  // Ownership is snapshotted at payment time and never rewritten by later changes (HANDOFF #002 Sec.3).
  DATA.payments.push({ id:paymentId, subscriberId, amount, date, method, archived:false, ownership: sub.ownership || 'unassigned',
    allocations: r.allocations, creditAddedC: r.creditAddedC });
  logAudit(`Recorded ${method} payment of ${peso(amount)} for ${sub.name}`);
  const saved = await saveData();
  closeModal();
  navigate('subscribers');
  // Email only after the payment is durably saved; its delivery state is stored separately and never alters the payment.
  if(saved) sendReceiptEmail(sub, paymentId);
}

async function sendReceiptEmail(subscriber, paymentId){
  const payment = DATA.payments.find(p=>p.id===paymentId);
  if(!payment) return;
  if(payment.confirmationEmail) return; // already attempted for this payment event -- never send twice
  let result;
  if(!subscriber.email){
    console.warn('No email on file for', subscriber.name, '- skipping receipt.');
    result = { status:'skipped-no-email' };
  } else {
    try{
      const res = await fetch('/api/send-receipt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: subscriber.email,
          subscriberName: subscriber.name,
          accountUsername: subscriber.accountUsername || '',
          plan: subscriber.plan,
          amount: payment.amount,
          breakdown: (()=>{ const by={subscription:0,installation:0,opening:0}; (payment.allocations||[]).forEach(a=>{ by[a.kind]=(by[a.kind]||0)+a.c/100; }); return by; })(),
          creditAdded: (payment.creditAddedC||0)/100,
          remainingOutstanding: (subscriber.billing && !subscriber.billing.review) ? BILL.summary(subscriber, todayLocal()).outstandingC/100 : null,
          date: payment.date,
          method: payment.method || '',
          businessName: DATA.business.name,
          logoUrl: DATA.business.logo || ''
        })
      });
      if(!res.ok){
        const errText = await res.text();
        lastEmailStatus = { ok:false, at:new Date(), error:errText };
        console.error('Receipt email failed:', errText);
        result = { status:'failed' };
      } else {
        lastEmailStatus = { ok:true, at:new Date() };
        result = { status:'sent' };
      }
    }catch(e){
      lastEmailStatus = { ok:false, at:new Date(), error:String(e) };
      console.error('Receipt email request failed', e);
      result = { status:'failed' };
    }
  }
  // Independent delivery state, stored on the payment record (does not alter amount/status/ownership).
  const live = DATA.payments.find(p=>p.id===paymentId);
  if(live){ live.confirmationEmail = { status: result.status, at: new Date().toISOString() }; await saveData(); }
}

// "Sent" means the mail server (Gmail SMTP) ACCEPTED the message. It does not prove the customer's inbox received it

function noticePanelHtml(){

  const lab = { 'will-retry':'Failed — will retry automatically', 'retries-exhausted':'Failed — automatic retries used up', 'unconfirmed':'Unconfirmed — the run ended before the result was saved', 'no-email':'No email address was on file' };
  const typ = { pending:'Pending reminder', overdue:'Overdue warning', extReminder:'Extension reminder' };
  return `<div class="card" style="padding:12px;margin-bottom:12px;border-left:3px solid var(--amber);">

    ${list.map(n=>`<div style="display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;border-top:1px solid var(--border,#e5e7eb);padding:8px 0;font-size:12.5px;">

      ${can('edit_subscriber')&&n.canRetry&&n.state!=='will-retry'?`<button class="btn" onclick="retryNotice('${n.subId}','${n.itemId}','${escapeHtml(n.key)}')">Retry</button>`:''}</div>`).join('')}
    </div>`;
}
async function retryNotice(subId,itemId,key){
  if(!can('edit_subscriber')) return; const s = DATA.subscribers.find(x=>x.id===subId); if(!s||!s.billing) return;
  const m = (BILL.find(s.billing,itemId)||{}).notified; const st = m && m[key] && m[key].status;
  const warn = (st==='unknown'||st==='claimed') ? ' The earlier attempt has no recorded result, so the customer may already have received it and could get a duplicate.' : '';
  if(!confirm(`Queue this notice for ${s.name} to be sent again at the next daily check?${warn}`)) return;
  const r = BILL.requeueNotice(s,itemId,key,todayLocal(),SESSION?SESSION.name:null);
  if(!r.ok){ alert(r.error); return; }
  logAudit(`Re-queued ${key.split(':')[0]} notice for ${s.name} (was ${st})`);
  await saveData(); renderReminders();
}

/* ============ CALENDAR (HANDOFF #002 Sections 10-13: recurring monthly
   collection view, not a literal historical due-date calendar) ============
   For each active subscriber, this month's obligation date is derived from
   their recurring billing day (billingDayOf = day-of-month of `due`),
   clamped into whichever month/year is being viewed -- so a subscriber
   with billing day 15 appears every month, regardless of what year their
   stored `due` happens to be in (Section 10/11, Test A/B/S).

   Resolving that date's status against the subscriber's actual `due`
   pointer (the authoritative "current outstanding cycle" marker that
   confirmPayment()/the daily cron advance):
     - same month as `due`, status pending/overdue(legacy)/extended ->
       actionable this cycle (PENDING / DISCONNECTION WARNING / EXTENDED)
     - this month's obligation date is BEFORE `due` -> already resolved
       and paid (due already advanced past it) -> hidden (Section 12:
       "removed from default outstanding Calendar", history untouched)
     - otherwise (this month is `due`'s month while paid, or a future
       month) -> upcoming, not yet due -> DUE */
let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
function renderCalendar(){
  const root = document.getElementById('page-root');
  root.innerHTML = `
    <div class="page-head"><div><h2 class="page-title">Calendar</h2><p class="page-sub">Monthly collection view — which subscribers still need action this month</p></div></div>

      <div class="cal-head">
        <button class="icon-btn" onclick="calShift(-1)" aria-label="Previous month"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
        <div style="font-weight:600;" id="cal-label"></div>
        <button class="icon-btn" onclick="calShift(1)" aria-label="Next month"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-2);margin:2px 0 12px;">
        <span><span class="tag tag-blue" style="padding:1px 6px;">Due</span> upcoming, not yet due</span>
        <span><span class="tag tag-amber" style="padding:1px 6px;">Pending</span> unpaid past due date</span>
        <span><span class="tag tag-gray" style="padding:1px 6px;background:#e4d6fb;color:#5c2d9e;">Extended</span> manual extension active</span>
        <span><span class="tag tag-red" style="padding:1px 6px;">Overdue</span> 5+ days unpaid</span>
      </div>
      <div class="cal-grid" id="cal-dow"></div>
      <div class="cal-grid" id="cal-cells" style="margin-top:6px;"></div>
    </div>
  `;
  drawCalendar();
}
function calShift(delta){
  calMonth += delta;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  drawCalendar();
}
function daysBetweenDates(fromStr, toStr){
  const a = new Date(fromStr+'T00:00:00');
  const b = new Date(toStr+'T00:00:00');
  return Math.floor((b-a)/(1000*60*60*24));
}
// Shared with the Dashboard/Reminders so every view agrees on what a
// subscriber's calendar entry for a given month looks like.
function calendarEntriesFor(s, year, monthIndex){
  // HANDOFF #004 Sec.11: built from the billing ledger. Shows generated unpaid charges for the month (with the
  // subscription/installation breakdown) plus the scheduled next billing date; paid/resolved charges disappear from this
  // outstanding view (payment history is untouched). Unverified (review) subscribers are not shown.
  if(s.archived || s.permanentlyDeleted || s.status==='disconnected' || !s.billing || s.billing.review) return [];
  const b = s.billing, today = todayLocal();
  const mm = String(monthIndex+1).padStart(2,'0');
  const from = year+'-'+mm+'-01', to = year+'-'+mm+'-'+String(new Date(year,monthIndex+1,0).getDate()).padStart(2,'0');
  const byDate = {};
  b.obligations.forEach(it=>{ if(!it.dueDate || it.dueDate<from || it.dueDate>to || BILL.remC(it)<=0 || it.rateReview) return; (byDate[it.dueDate]=byDate[it.dueDate]||[]).push(it); });
  const labels = { current:['DUE','due'], due:['DUE','due'], pending:['PENDING','pending'], overdue:['OVERDUE','warning'], extended:['EXTENDED','extended'] };
  const out = [];
  Object.keys(byDate).sort().forEach(d=>{
    const items = byDate[d], sub = items.find(i=>i.kind==='subscription'), inst = items.find(i=>i.kind==='installation');
    const totalC = items.reduce((a,i)=>a+BILL.remC(i),0);
    const st = sub ? BILL.subStatus(sub, today) : 'current';
    const [label,cls] = sub ? (labels[st]||['DUE','due']) : ['INSTALLATION','due'];
    const parts = []; if(sub) parts.push('subscription '+peso(BILL.fromC(BILL.remC(sub)))); if(inst) parts.push('installation '+peso(BILL.fromC(BILL.remC(inst))));
    const ext = sub && sub.ext && !sub.ext.resolution ? ' · extended until '+sub.ext.until : '';
    out.push({ label, cls, date:d, amountC:totalC, note: peso(BILL.fromC(totalC))+' ('+parts.join(' + ')+')'+ext });
  });
  if(!out.length && b.billingDay && b.firstDue && !BILL.find(b,'sub:'+from.slice(0,7))){
    const d = BILL.nextDueOnOrAfter(b.billingDay, from);
    const resume = b.resumeFrom || b.firstDue;
    if(d<=to && d>today && d>=b.firstDue && d>=resume){ out.push({ label:'DUE', cls:'due', date:d, amountC:BILL.toC(s.rate), note:peso(s.rate)+' scheduled (not billed yet)' }); }
  }
  return out;
}
function drawCalendar(){
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-label').textContent = `${monthNames[calMonth]} ${calYear}`;
  document.getElementById('cal-dow').innerHTML = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const entriesByDay = {};
  DATA.subscribers.forEach(s=>{
    calendarEntriesFor(s, calYear, calMonth).forEach(entry=>{
      const day = Number(entry.date.slice(8,10));
      entriesByDay[day] = entriesByDay[day]||[];
      entriesByDay[day].push({ name:s.name, ...entry });
    });
  });
  const clsTag = { due:'tag-blue', pending:'tag-amber', extended:'tag-gray', warning:'tag-red' };
  const clsDue = { due:'cal-due', pending:'cal-due', extended:'cal-due', warning:'cal-due' };
  let html = '';
  for(let i=0;i<firstDay;i++) html += '<div class="cal-cell empty"></div>';
  for(let day=1; day<=daysInMonth; day++){
    const entries = entriesByDay[day]||[];
    html += `<div class="cal-cell"><div class="cal-date">${day}</div>${entries.slice(0,2).map(e=>`<div class="${clsDue[e.cls]}" title="${escapeHtml(e.name)} — ${e.label}${e.note?(' ('+escapeHtml(e.note)+')'):''}" style="${e.cls==='pending'?'':(e.cls==='warning'?'background:var(--red-bg);color:var(--red);':(e.cls==='extended'?'background:#e4d6fb;color:#5c2d9e;':'background:var(--accent-bg);color:var(--accent-dark);'))}">${escapeHtml(e.name)} · ${peso(BILL.fromC(e.amountC))}</div>`).join('')}${entries.length>2?`<div style="font-size:10px;color:var(--text-3);">+${entries.length-2} more</div>`:''}</div>`;
  }
  document.getElementById('cal-cells').innerHTML = html;
}

async function saveExpense(){

/* HANDOFF #009 (Audit Phase A): expenses are never erased. "Void" marks the record (who/when/why) and removes it from totals;
   the database refuses to let staff remove or edit an existing expense. */
function liveExpenses(){ return (DATA.expenses||[]).filter(e=>!e.voided); }
async function voidExpense(id){
  if(!can('edit_expense')) return;
  const e = (DATA.expenses||[]).find(x=>x.id===id);
  if(!e || e.voided) return;
  if(!confirm('Void this expense? The record stays (marked void, excluded from totals) so the history is preserved.')) return;
  e.voided = { at:new Date().toISOString(), by: SESSION ? SESSION.name : 'System', reason:'Voided from Expenses page' };
  logAudit('Voided expense "'+e.description+'" ('+peso(e.amount)+')');
  await saveData();
  navigate('expenses');
}

function timeAgo(date){
  const secs = Math.floor((Date.now() - date.getTime())/1000);
  if(secs < 60) return 'just now';
  const mins = Math.floor(secs/60);
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}

function handleGcashQrUpload(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  if(file.size > 1.5*1024*1024){ alert('Please use an image under 1.5MB.'); return; }
  const reader = new FileReader();
  reader.onload = async ()=>{
    DATA.business.paymentInfo = DATA.business.paymentInfo || {};
    DATA.business.paymentInfo.gcashQrUrl = reader.result; // data: URI, same pattern as business.logo
    logAudit('Uploaded a GCash QR code');
    await saveData();
    navigate('settings');
  };
  reader.readAsDataURL(file);
}

function exportCSV(type){
  const rows = { subscribers: [], payments: [], expenses: [] };
  if(type === 'subscribers'){
    rows.subscribers.push(['Name','Address','Email','Phone','WhatsApp','Facebook','Messenger','Plan','Rate','Due Date','Status','Archived']);
    DATA.subscribers.filter(s=>!s.permanentlyDeleted).forEach(s=> rows.subscribers.push([s.name,s.address,s.email,s.phone,s.whatsapp,s.fb,s.messenger,s.plan,s.rate,s.due,s.status, s.archived?'Yes':'No']));
  } else if(type === 'payments'){
    rows.payments.push(['Date','Subscriber','Amount','Method']);
    DATA.payments.forEach(p=> rows.payments.push([p.date, (DATA.subscribers.find(s=>s.id===p.subscriberId)||{}).name||'Unknown', p.amount, p.method]));
  } else if(type === 'expenses'){
    rows.expenses.push(['Date','Description','Category','Amount']);
    liveExpenses().forEach(e=> rows.expenses.push([e.date, e.description, e.category, e.amount]));
  }
  const csvRows = rows[type];
  const csv = csvRows.map(r => r.map(cell => {
    const s = String(cell ?? '');
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `signaldesk-${type}-${todayLocal()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  logAudit(`Exported ${type} as CSV`);
}

      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="ac-save-btn" onclick="saveAccount()">Add account</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('show');
}
async function saveAccount(){
  const name = document.getElementById('ac-name').value.trim();
  const email = document.getElementById('ac-email').value.trim();
  const password = document.getElementById('ac-password').value;
  const role = document.getElementById('ac-role').value;
  const errEl = document.getElementById('ac-err');
  if(!name || !email || !password){ errEl.textContent = 'Fill in every field first'; return; }
  if(password.length < 6){ errEl.textContent = 'Password must be at least 6 characters'; return; }
  const btn = document.getElementById('ac-save-btn');
  btn.disabled = true;
  btn.textContent = 'Adding…';
  try{
    const res = await fetch('/api/manage-accounts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'create', accessToken: SESSION.accessToken, email, password, name, role })
    });
    const result = await res.json();
    if(!res.ok){
      errEl.textContent = result.error || 'Could not create account';
      btn.disabled = false;
      btn.textContent = 'Add account';
      return;
    }
    closeModal();
    navigate('settings');
  }catch(e){
    errEl.textContent = 'Network error — please try again';
    btn.disabled = false;
    btn.textContent = 'Add account';
  }
}
async function deleteAccount(userId){
  if(userId === SESSION.userId) return;
  if(!confirm('Remove this account? This cannot be undone.')) return;
  try{
    const res = await fetch('/api/manage-accounts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', accessToken: SESSION.accessToken, targetUserId: userId })
    });
    if(!res.ok){
      const result = await res.json();
      alert(result.error || 'Could not remove account');
      return;
    }
    await renderAccountsTable();
  }catch(e){
    alert('Network error — please try again');
  }
}

/* ============ INIT ============ */
(async function init(){
  await loadData();
  renderLoginBrand();
  if(SUPABASE_READY){
    const { data: { session } } = await sb.auth.getSession();
    if(session){
      await establishSession(session);
    }
  }
})();

/* ============ PWA: register service worker ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(e=>{
      console.warn('Service worker registration failed (app still works normally):', e);
    });
  });
}
</script>
